<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050506">
<title>Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="lock.js" defer></script>
<script src="sync.js" defer></script>
<script src="topbar.js" defer></script>
<style>
:root {
  --text-primary: #FAFAFA;
  --text-secondary: #B8B6B0;
  --text-tertiary: #76746E;
  --success: #6BE3A4;
  --warning: #F2C063;
  --danger: #FF6B6B;
  --font: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: #050506;
  color: var(--text-secondary);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  -webkit-text-size-adjust: 100%;
}
body {
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;
  padding: max(28px, env(safe-area-inset-top)) 20px 80px;
}
body::before {
  content: '';
  position: fixed; inset: 0;
  background:
    radial-gradient(circle at 82% 14%, rgba(107, 227, 164, 0.12), transparent 45%),
    radial-gradient(circle at 18% 90%, rgba(125, 211, 252, 0.08), transparent 50%);
  filter: blur(40px);
  pointer-events: none;
  z-index: -2;
  animation: drift 36s ease-in-out infinite alternate;
}
body::after {
  content: '';
  position: fixed; inset: 0;
  background-image: radial-gradient(rgba(255,255,255,0.014) 1px, transparent 1px);
  background-size: 3px 3px;
  pointer-events: none;
  z-index: -1;
}
@keyframes drift {
  0%   { transform: translate3d(0,0,0); }
  100% { transform: translate3d(-22px, 14px, 0); }
}

.page {
  max-width: 900px;
  margin: 0 auto;
}

.dash-title {
  margin: 0 0 20px;
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -0.025em;
  background: linear-gradient(180deg, #FFFFFF 0%, #C7C4BC 120%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: transparent;
}
@media (max-width: 480px) { .dash-title { font-size: 22px; } }

/* ===== Bento grid ===== */
.bento {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-auto-rows: 168px;
  gap: 14px;
  grid-auto-flow: dense;
}

/* ===== Tile base ===== */
.tile {
  --accent: #6BE3A4;
  position: relative;
  display: flex;
  flex-direction: column;
  text-decoration: none;
  color: inherit;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: 18px;
  padding: 16px 18px 14px;
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  overflow: hidden;
  transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
  will-change: transform;
}
.tile::before {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(circle at 75% 20%, color-mix(in srgb, var(--accent) 8%, transparent), transparent 65%);
  pointer-events: none;
  border-radius: inherit;
  transition: opacity 0.18s ease;
  opacity: 0;
}
.tile:hover {
  transform: translateY(-3px);
  border-color: color-mix(in srgb, var(--accent) 35%, rgba(255,255,255,0.06));
  box-shadow: 0 8px 28px rgba(0,0,0,0.35);
}
.tile:hover::before { opacity: 1; }
.tile:hover .tile-arrow { transform: translateX(4px); color: var(--accent); }

/* Size modifiers */
.tile.big  { grid-column: span 2; grid-row: span 2; padding: 22px 24px 18px; }
.tile.wide { grid-column: span 2; }

/* ===== Tile internals ===== */
.tile-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
}
.tile-num {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.06em;
  color: var(--text-tertiary);
  line-height: 1;
}
.tile-emoji {
  font-size: 22px;
  line-height: 1;
  filter: drop-shadow(0 0 8px var(--accent));
  user-select: none;
}
.tile.big .tile-emoji { font-size: 32px; }

.tile-spacer { flex: 1; }

.tile-title {
  font-size: 16px;
  font-weight: 700;
  letter-spacing: -0.015em;
  color: var(--text-primary);
  margin: 0 0 6px;
}
.tile.big .tile-title { font-size: 22px; margin-bottom: 8px; }

.tile-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.tile-sub {
  font-size: 11.5px;
  color: var(--text-tertiary);
  line-height: 1.3;
  flex: 1;
  min-width: 0;
}
.tile.big .tile-sub { font-size: 13px; }
.tile-arrow {
  font-size: 15px;
  color: var(--text-tertiary);
  transition: transform 0.18s ease, color 0.18s ease;
  flex-shrink: 0;
  line-height: 1;
}

/* ===== Responsive ===== */
@media (max-width: 720px) {
  .bento {
    grid-template-columns: repeat(2, 1fr);
  }
  .tile.big {
    grid-column: span 2;
    grid-row: span 1;
  }
}
@media (max-width: 440px) {
  .bento {
    grid-template-columns: 1fr;
    grid-auto-rows: 140px;
  }
  .tile.big,
  .tile.wide {
    grid-column: span 1;
    grid-row: span 1;
  }
}
</style>
</head>
<body>
<div class="page">
  <h1 class="dash-title">Dashboard</h1>

  <div class="bento">

    <!-- ·01 Main — big -->
    <a class="tile big" href="main.html" style="--accent:#6BE3A4">
      <div class="tile-top">
        <span class="tile-num">·01</span>
        <span class="tile-emoji">🏠</span>
      </div>
      <div class="tile-spacer"></div>
      <p class="tile-title">Main</p>
      <div class="tile-footer">
        <span class="tile-sub">Goals &amp; daily plan</span>
        <span class="tile-arrow">→</span>
      </div>
    </a>

    <!-- ·02 Fitness — wide -->
    <a class="tile wide" href="gym.html" style="--accent:#7DD3FC">
      <div class="tile-top">
        <span class="tile-num">·02</span>
        <span class="tile-emoji">💪</span>
      </div>
      <div class="tile-spacer"></div>
      <p class="tile-title">Fitness</p>
      <div class="tile-footer">
        <span class="tile-sub">Workouts, splits, sessions</span>
        <span class="tile-arrow">→</span>
      </div>
    </a>

    <!-- ·03 Health — small -->
    <a class="tile" href="health.html" style="--accent:#A7F3D0">
      <div class="tile-top">
        <span class="tile-num">·03</span>
        <span class="tile-emoji">💊</span>
      </div>
      <div class="tile-spacer"></div>
      <p class="tile-title">Health</p>
      <div class="tile-footer">
        <span class="tile-sub">Supplements &amp; vitals</span>
        <span class="tile-arrow">→</span>
      </div>
    </a>

    <!-- ·04 Water — small -->
    <a class="tile" href="po-water.html" style="--accent:#60A5FA">
      <div class="tile-top">
        <span class="tile-num">·04</span>
        <span class="tile-emoji">💧</span>
      </div>
      <div class="tile-spacer"></div>
      <p class="tile-title">Water</p>
      <div class="tile-footer">
        <span class="tile-sub">Hydration</span>
        <span class="tile-arrow">→</span>
      </div>
    </a>

    <!-- ·05 Finance — wide -->
    <a class="tile wide" href="finance.html" style="--accent:#F2C063">
      <div class="tile-top">
        <span class="tile-num">·05</span>
        <span class="tile-emoji">📊</span>
      </div>
      <div class="tile-spacer"></div>
      <p class="tile-title">Finance</p>
      <div class="tile-footer">
        <span class="tile-sub">Net worth &amp; spending</span>
        <span class="tile-arrow">→</span>
      </div>
    </a>

    <!-- ·06 Caffeine — small -->
    <a class="tile" href="caffeine.html" style="--accent:#C9A36B">
      <div class="tile-top">
        <span class="tile-num">·06</span>
        <span class="tile-emoji">☕</span>
      </div>
      <div class="tile-spacer"></div>
      <p class="tile-title">Caffeine</p>
      <div class="tile-footer">
        <span class="tile-sub">Intake &amp; timing</span>
        <span class="tile-arrow">→</span>
      </div>
    </a>

  </div>
</div>
</body>
</html>
