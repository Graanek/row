<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Zaloguj się</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d0f14;
      color: #e7e9ee;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    form {
      width: 100%;
      max-width: 320px;
      padding: 32px 28px;
      background: #161a22;
      border: 1px solid #242a36;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
    }
    h1 { margin: 0 0 4px; font-size: 20px; }
    p.sub { margin: 0 0 20px; font-size: 13px; color: #8b93a3; }
    label { display: block; font-size: 13px; margin-bottom: 6px; color: #b6bdca; }
    input {
      width: 100%;
      padding: 12px 14px;
      font-size: 15px;
      color: #e7e9ee;
      background: #0d0f14;
      border: 1px solid #2c3340;
      border-radius: 10px;
      outline: none;
    }
    input:focus { border-color: #4c7dff; }
    button {
      width: 100%;
      margin-top: 16px;
      padding: 12px;
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      background: #4c7dff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
    button:hover { background: #3d6af0; }
    .error {
      margin-top: 14px;
      padding: 10px 12px;
      font-size: 13px;
      color: #ffb4b4;
      background: rgba(255, 80, 80, 0.1);
      border: 1px solid rgba(255, 80, 80, 0.3);
      border-radius: 10px;
      display: none;
    }
  </style>
</head>
<body>
  <form method="POST" action="/api/login">
    <h1>🔒 Dashboard</h1>
    <p class="sub">Wpisz hasło, żeby kontynuować.</p>
    <label for="password">Hasło</label>
    <input id="password" name="password" type="password" autofocus autocomplete="current-password" required />
    <button type="submit">Wejdź</button>
    <div class="error" id="error">Nieprawidłowe hasło.</div>
  </form>
  <script>
    if (new URLSearchParams(location.search).has('error')) {
      document.getElementById('error').style.display = 'block';
    }
  </script>
</body>
</html>
