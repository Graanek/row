<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#020617">
<title>Life Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="sync.js" defer></script>
<script src="tracker.js" defer></script>
<script src="topbar.js" defer></script>
<style>
:root {
  --bg: #020617;
  --surface: #0B1120;
  --surface-2: #111A2E;
  --border: rgba(63, 63, 70, 0.5);
  --text: #F4F4F5;
  --text-2: #A1A1AA;
  --text-3: #71717A;
  --accent: #2DD4BF;
  --accent-soft: rgba(45, 212, 191, 0.12);
  --accent-line: rgba(45, 212, 191, 0.3);
  --warn: #FBBF24;
  --danger: #FB7185;
  --font: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 16px;
  --r-lg: 20px;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--text-2);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
}
body { min-height: 100vh; padding: 16px 16px 60px; }
body::before {
  content: '';
  position: fixed; inset: 0; z-index: -1;
  background: radial-gradient(circle at 85% 8%, rgba(45, 212, 191, 0.07), transparent 42%);
  pointer-events: none;
}
.page { max-width: 760px; margin: 0 auto; }

/* ---------- entry stagger ---------- */
.stagger { animation: rise 0.45s cubic-bezier(0.22, 1, 0.36, 1) both; }
.stagger:nth-child(2) { animation-delay: 0.05s; }
.stagger:nth-child(3) { animation-delay: 0.10s; }
.stagger:nth-child(4) { animation-delay: 0.15s; }
.stagger:nth-child(5) { animation-delay: 0.20s; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ---------- header ---------- */
.head { margin: 6px 0 16px; }
.head h1 {
  margin: 0; font-size: 26px; font-weight: 750; letter-spacing: -0.025em;
  color: var(--text);
}
.head .sub {
  font-family: var(--mono); font-size: 12px; color: var(--text-3);
  margin-top: 3px; letter-spacing: 0.02em;
}
.suggestion {
  margin-top: 12px;
  padding: 12px 14px;
  border-radius: var(--r);
  background: var(--accent-soft);
  border: 1px solid var(--accent-line);
  color: var(--text); font-size: 13.5px; line-height: 1.45;
  display: none;
}
.suggestion.show { display: block; }
.suggestion .tag {
  font-family: var(--mono); font-size: 9.5px; font-weight: 800;
  letter-spacing: 0.16em; color: var(--accent); display: block; margin-bottom: 3px;
}

/* ---------- cards ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 16px;
  margin-bottom: 14px;
  transition: border-color 0.2s;
}
.card:hover { border-color: rgba(113, 113, 122, 0.6); }
.card-title {
  font-size: 10.5px; font-weight: 750; letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--text-3); margin: 0 0 12px;
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
}

/* ---------- quick log chips ---------- */
.chips { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
@media (min-width: 560px) { .chips { grid-template-columns: repeat(3, 1fr); } }
.chip {
  min-height: 56px;
  display: flex; flex-direction: column; align-items: flex-start; justify-content: center;
  gap: 2px; padding: 10px 13px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--r);
  color: var(--text); font-family: inherit; font-size: 14px; font-weight: 600;
  cursor: pointer; text-align: left;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.15s, transform 0.1s, border-color 0.15s;
}
.chip:hover { border-color: var(--accent-line); }
.chip:active { transform: scale(0.97); }
.chip small { font-size: 11px; font-weight: 500; color: var(--text-3); font-family: var(--mono); }
.chip.primary { background: var(--accent-soft); border-color: var(--accent-line); }
.chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- today timeline ---------- */
.tl { list-style: none; margin: 0; padding: 0; }
.tl li {
  display: flex; align-items: baseline; gap: 10px;
  padding: 9px 2px;
  border-bottom: 1px solid rgba(63, 63, 70, 0.3);
  font-size: 14px; color: var(--text);
}
.tl li:last-child { border-bottom: none; }
.tl .t { font-family: var(--mono); font-size: 12px; color: var(--text-3); min-width: 44px; }
.tl .what { flex: 1; }
.tl .meta { font-family: var(--mono); font-size: 12px; color: var(--accent); }
.tl .meta.neg { color: var(--danger); }
.empty { font-size: 13.5px; color: var(--text-3); padding: 6px 2px; }

/* ---------- stat tiles ---------- */
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tile {
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: var(--r); padding: 12px 12px 10px;
}
.tile .v {
  font-family: var(--mono); font-size: 22px; font-weight: 750;
  font-variant-numeric: tabular-nums; color: var(--text); line-height: 1;
}
.tile .l { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-3); margin-top: 5px; }

/* ---------- heatmap ---------- */
.hm-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.hm-nav { display: flex; align-items: center; gap: 6px; }
.hm-nav button {
  width: 36px; height: 36px; border-radius: 10px;
  background: var(--surface-2); border: 1px solid var(--border);
  color: var(--text); font-size: 16px; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.hm-nav .lbl { font-family: var(--mono); font-size: 13px; color: var(--text); min-width: 110px; text-align: center; }
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 2px; gap: 2px; }
.seg button {
  border: none; background: transparent; color: var(--text-3);
  font-family: inherit; font-size: 12px; font-weight: 600;
  padding: 7px 10px; border-radius: 8px; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.seg button.on { background: var(--accent-soft); color: var(--accent); }
.hm-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.hm-dow { font-family: var(--mono); font-size: 9.5px; color: var(--text-3); text-align: center; padding-bottom: 2px; }
.hm-cell {
  aspect-ratio: 1; border-radius: 8px;
  background: var(--surface-2); border: 1px solid transparent;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--mono); font-size: 10.5px; color: var(--text-3);
  cursor: pointer; -webkit-tap-highlight-color: transparent;
  transition: transform 0.1s, border-color 0.15s;
}
.hm-cell:active { transform: scale(0.92); }
.hm-cell.has { color: rgba(2, 6, 23, 0.85); font-weight: 700; }
.hm-cell.today { border-color: var(--accent); }
.hm-cell.blank { background: transparent; cursor: default; }
.hm-legend { display: flex; align-items: center; gap: 6px; margin-top: 10px; font-family: var(--mono); font-size: 10px; color: var(--text-3); }
.hm-legend .sw { width: 14px; height: 14px; border-radius: 4px; }

/* ---------- findings ---------- */
.find { list-style: none; margin: 0; padding: 0; }
.find li {
  display: flex; gap: 10px; align-items: baseline;
  padding: 9px 2px; border-bottom: 1px solid rgba(63,63,70,0.3);
  font-size: 13.5px; color: var(--text); line-height: 1.4;
}
.find li:last-child { border-bottom: none; }
.find .d {
  font-family: var(--mono); font-size: 12px; font-weight: 700; min-width: 44px;
  color: var(--accent);
}
.find .d.neg { color: var(--danger); }
.progressbar { height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; margin-top: 8px; }
.progressbar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width 0.6s cubic-bezier(0.22,1,0.36,1); }

/* ---------- weekday bars ---------- */
.wk { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; align-items: end; height: 90px; }
.wk .col { display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; }
.wk .bar { width: 100%; max-width: 30px; border-radius: 6px 6px 3px 3px; background: var(--accent); opacity: 0.85; min-height: 3px; transition: height 0.5s cubic-bezier(0.22,1,0.36,1); }
.wk .bar.low { background: var(--warn); }
.wk .lbl { font-family: var(--mono); font-size: 9.5px; color: var(--text-3); }

/* ---------- buttons / forms ---------- */
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
.btn {
  min-height: 44px; padding: 10px 16px;
  border-radius: 12px; border: 1px solid var(--border);
  background: var(--surface-2); color: var(--text);
  font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.15s, transform 0.1s;
}
.btn:active { transform: scale(0.97); }
.btn.primary { background: var(--accent); color: #042F2E; border-color: transparent; }
.btn.danger { color: var(--danger); border-color: rgba(251, 113, 133, 0.3); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- bottom sheet ---------- */
.sheet-bg {
  position: fixed; inset: 0; z-index: 60;
  background: rgba(2, 6, 23, 0.65);
  -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
  display: none; align-items: flex-end; justify-content: center;
}
.sheet-bg.show { display: flex; }
.sheet {
  width: 100%; max-width: 560px;
  max-height: 88vh; overflow-y: auto; overscroll-behavior: contain;
  background: var(--surface);
  border: 1px solid var(--border); border-bottom: none;
  border-radius: 22px 22px 0 0;
  padding: 18px 18px calc(22px + env(safe-area-inset-bottom));
  animation: sheet-up 0.28s cubic-bezier(0.22, 1, 0.36, 1);
}
@keyframes sheet-up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet h2 { margin: 0 0 14px; font-size: 18px; font-weight: 700; color: var(--text); letter-spacing: -0.01em; }
.f-row { margin-bottom: 14px; }
.f-label { display: block; font-size: 12px; font-weight: 600; color: var(--text-2); margin-bottom: 7px; }
.f-label .val { font-family: var(--mono); color: var(--accent); float: right; font-weight: 700; }
input[type="text"], input[type="time"], input[type="number"] {
  width: 100%; min-height: 46px; padding: 10px 13px;
  background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px;
  color: var(--text); font-family: inherit; font-size: 15px; outline: none;
  transition: border-color 0.15s;
}
input:focus { border-color: var(--accent); }
input[type="range"] {
  width: 100%; height: 44px; margin: 0;
  -webkit-appearance: none; appearance: none; background: transparent;
}
input[type="range"]::-webkit-slider-runnable-track {
  height: 8px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--border);
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 28px; height: 28px; border-radius: 50%;
  background: var(--accent); margin-top: -11px; border: 3px solid var(--bg);
  box-shadow: 0 2px 8px rgba(0,0,0,0.4);
}
input[type="range"]::-moz-range-track { height: 8px; border-radius: 99px; background: var(--surface-2); }
input[type="range"]::-moz-range-thumb { width: 26px; height: 26px; border-radius: 50%; background: var(--accent); border: 3px solid var(--bg); }
.toggle-row { display: flex; gap: 8px; }
.tgl {
  flex: 1; min-height: 46px; border-radius: 12px;
  background: var(--surface-2); border: 1px solid var(--border);
  color: var(--text-2); font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.tgl.on { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent); }
.tgl.on.bad { background: rgba(251,113,133,0.12); border-color: rgba(251,113,133,0.35); color: var(--danger); }
.tagrow { display: flex; flex-wrap: wrap; gap: 7px; }
.tagrow .tgl { flex: 0 0 auto; padding: 0 14px; }
.ac { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 8px; }
.ac button {
  border: 1px solid var(--border); background: var(--surface-2); color: var(--text-2);
  border-radius: 99px; padding: 8px 13px; font-family: inherit; font-size: 12.5px; cursor: pointer;
  min-height: 38px; -webkit-tap-highlight-color: transparent;
}
.ac button small { color: var(--text-3); font-family: var(--mono); }
.sheet-actions { display: flex; gap: 8px; margin-top: 18px; }
.sheet-actions .btn { flex: 1; min-height: 50px; font-size: 15px; }

/* ---------- day edit modal list ---------- */
.edit-list { list-style: none; margin: 0 0 8px; padding: 0; }
.edit-list li {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 0; border-bottom: 1px solid rgba(63,63,70,0.3);
  font-size: 13.5px; color: var(--text);
}
.edit-list .t { font-family: var(--mono); font-size: 12px; color: var(--text-3); min-width: 42px; }
.edit-list .x {
  margin-left: auto; width: 38px; height: 38px; border-radius: 10px;
  border: 1px solid rgba(251,113,133,0.3); background: transparent; color: var(--danger);
  font-size: 15px; cursor: pointer; -webkit-tap-highlight-color: transparent;
}

/* ---------- snackbar ---------- */
.snack {
  position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom));
  transform: translateX(-50%) translateY(20px);
  z-index: 70; opacity: 0; pointer-events: none;
  display: flex; align-items: center; gap: 14px;
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 14px; padding: 11px 14px;
  color: var(--text); font-size: 13.5px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  transition: opacity 0.22s, transform 0.22s;
  max-width: calc(100vw - 32px);
}
.snack.show { opacity: 1; transform: translateX(-50%); pointer-events: auto; }
.snack button {
  border: none; background: transparent; color: var(--accent);
  font-family: inherit; font-size: 13.5px; font-weight: 700; cursor: pointer; padding: 6px;
  min-height: 40px;
}
</style>
</head>
<body>
<div class="page">

  <header class="head stagger">
    <h1>Life</h1>
    <div class="sub" id="todayLabel"></div>
    <div class="suggestion" id="suggestion"><span class="tag">SUGESTIA DNIA</span><span id="suggestionText"></span></div>
  </header>

  <section class="card stagger">
    <h2 class="card-title">Szybki wpis <span id="quickHint" style="font-family:var(--mono);font-weight:500;text-transform:none;letter-spacing:0"></span></h2>
    <div class="chips">
      <button class="chip primary" id="chipWake"><span>🌅 Właśnie wstałem</span><small id="chipWakeHint"></small></button>
      <button class="chip" id="chipMood"><span>🧠 Nastrój / energia</span><small>2 suwaki + tagi</small></button>
      <button class="chip" id="chipMeal"><span>🍽 Posiłek</span><small id="chipMealHint"></small></button>
      <button class="chip" id="chipMove"><span>🏋️ Ruch</span><small id="chipMoveHint"></small></button>
      <button class="chip" id="chipSupp"><span>💊 Suplement</span><small id="chipSuppHint"></small></button>
      <button class="chip" id="chipProd"><span>⏱ Produktywność</span><small>deep work + pomodoro</small></button>
    </div>
  </section>

  <section class="card stagger">
    <h2 class="card-title">Dziś</h2>
    <div class="tiles" id="tiles"></div>
    <ul class="tl" id="timeline"></ul>
  </section>

  <section class="card stagger">
    <h2 class="card-title">Wzorce</h2>
    <div id="patternsBody"></div>
    <div style="margin-top:14px">
      <div class="card-title" style="margin-bottom:8px">Energia wg dnia tygodnia</div>
      <div class="wk" id="weekdayBars"></div>
    </div>
  </section>

  <section class="card stagger">
    <div class="hm-head">
      <h2 class="card-title" style="margin:0">Historia</h2>
      <div class="seg" id="metricSeg">
        <button data-m="mood" class="on">Nastrój</button>
        <button data-m="sleepH">Sen</button>
        <button data-m="energy">Energia</button>
      </div>
    </div>
    <div class="hm-nav" style="justify-content:center;margin-bottom:10px">
      <button id="hmPrev" aria-label="Poprzedni miesiąc">‹</button>
      <span class="lbl" id="hmLabel"></span>
      <button id="hmNext" aria-label="Następny miesiąc">›</button>
    </div>
    <div class="hm-grid" id="hmGrid"></div>
    <div class="hm-legend">
      <span>mało</span>
      <span class="sw" style="background:var(--surface-2)"></span>
      <span class="sw" style="background:rgba(45,212,191,0.25)"></span>
      <span class="sw" style="background:rgba(45,212,191,0.55)"></span>
      <span class="sw" style="background:#2DD4BF"></span>
      <span>dużo</span>
      <span style="margin-left:auto">kliknij dzień → edycja</span>
    </div>
  </section>

  <section class="card stagger">
    <h2 class="card-title">Dane</h2>
    <div class="btn-row">
      <button class="btn" id="btnExportJSON">Eksport JSON</button>
      <button class="btn" id="btnExportCSV">Eksport CSV</button>
      <button class="btn" id="btnDemo">Dane demo (30 dni)</button>
      <button class="btn danger" id="btnWipe">Wyczyść wszystko</button>
    </div>
    <p class="empty" id="demoNote" style="display:none">⚠ Wczytane dane demo — „Wyczyść wszystko" usunie je przed prawdziwym trackingiem.</p>
  </section>

</div>

<!-- bottom sheet (single, re-rendered per form) -->
<div class="sheet-bg" id="sheetBg">
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>

<!-- undo snackbar -->
<div class="snack" id="snack">
  <span id="snackText"></span>
  <button id="snackUndo">Cofnij</button>
</div>

<script>
(function () {
'use strict';
function boot() {
  if (!window.LifeTracker) { setTimeout(boot, 30); return; }
  var T = window.LifeTracker;

  // ---------- cloud sync ----------
  if (typeof initCloudSync === 'function') {
    initCloudSync({ appKey: 'life', syncedPrefixes: ['life:'], onApplied: renderAll });
  }

  var todayKey = T.dateKey();
  var $ = function (id) { return document.getElementById(id); };

  // ---------- header ----------
  var MONTHS = ['stycznia','lutego','marca','kwietnia','maja','czerwca','lipca','sierpnia','września','października','listopada','grudnia'];
  var MONTHS_NOM = ['Styczeń','Luty','Marzec','Kwiecień','Maj','Czerwiec','Lipiec','Sierpień','Wrzesień','Październik','Listopad','Grudzień'];
  var DOWS = ['Pn','Wt','Śr','Cz','Pt','So','Nd'];
  (function () {
    var d = new Date();
    var dows = ['niedziela','poniedziałek','wtorek','środa','czwartek','piątek','sobota'];
    $('todayLabel').textContent = dows[d.getDay()] + ', ' + d.getDate() + ' ' + MONTHS[d.getMonth()];
  })();

  // ---------- snackbar / undo ----------
  var snackTimer = null;
  function snack(msg) {
    $('snackText').textContent = msg;
    $('snack').classList.add('show');
    clearTimeout(snackTimer);
    snackTimer = setTimeout(function () { $('snack').classList.remove('show'); }, 4500);
  }
  $('snackUndo').addEventListener('click', function () {
    if (T.undo()) snack('Cofnięto.');
    else $('snack').classList.remove('show');
  });

  // ---------- bottom sheet helpers ----------
  var sheetBg = $('sheetBg'), sheet = $('sheet');
  function openSheet(html) {
    sheet.innerHTML = html;
    sheetBg.classList.add('show');
    document.body.style.overflow = 'hidden';
  }
  function closeSheet() {
    sheetBg.classList.remove('show');
    sheet.innerHTML = '';
    document.body.style.overflow = '';
  }
  sheetBg.addEventListener('click', function (e) { if (e.target === sheetBg) closeSheet(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSheet(); });

  function sliderRow(id, label, min, max, step, val, unit) {
    return '<div class="f-row"><label class="f-label" for="' + id + '">' + label +
      ' <span class="val" id="' + id + 'Val">' + val + (unit || '') + '</span></label>' +
      '<input type="range" id="' + id + '" min="' + min + '" max="' + max + '" step="' + step + '" value="' + val + '"></div>';
  }
  function bindSlider(id, unit, fmt) {
    var el = $(id), out = $(id + 'Val');
    el.addEventListener('input', function () {
      out.textContent = (fmt ? fmt(el.value) : el.value) + (unit || '');
    });
  }
  function actions(saveLabel) {
    return '<div class="sheet-actions"><button class="btn" id="shCancel">Anuluj</button>' +
      '<button class="btn primary" id="shSave">' + (saveLabel || 'Zapisz') + '</button></div>';
  }
  function bindActions(onSave) {
    $('shCancel').addEventListener('click', closeSheet);
    $('shSave').addEventListener('click', function () { onSave(); closeSheet(); });
  }
  function toggle(el, cls) {
    el.classList.toggle('on');
    if (cls) el.classList.toggle(cls, el.classList.contains('on'));
  }

  // ---------- forms ----------
  function sleepForm(dayK, presetWake) {
    var typ = T.typicalSleep();
    var existing = T.getDay(dayK).sleep;
    var start = existing ? existing.start : typ.bed;
    var end = existing ? existing.end : (presetWake ? T.nowHM() : typ.wake);
    var hours = existing ? existing.hours : typ.hours;
    var q = existing ? existing.quality : 7;
    openSheet(
      '<h2>Sen</h2>' +
      '<div class="f-row" style="display:flex;gap:8px">' +
        '<div style="flex:1"><label class="f-label" for="slStart">Zasnąłem</label><input type="time" id="slStart" value="' + start + '"></div>' +
        '<div style="flex:1"><label class="f-label" for="slEnd">Wstałem</label><input type="time" id="slEnd" value="' + end + '"></div>' +
      '</div>' +
      sliderRow('slH', 'Czas snu', 3, 12, 0.5, hours, ' h') +
      sliderRow('slQ', 'Jakość', 1, 10, 1, q, '/10') +
      actions()
    );
    bindSlider('slH', ' h'); bindSlider('slQ', '/10');
    function recalc() {
      var a = T.hmToMin($('slStart').value), b = T.hmToMin($('slEnd').value);
      if (a == null || b == null) return;
      var h = Math.round(((b - a + 1440) % 1440) / 30) / 2;
      if (h > 0 && h <= 14) { $('slH').value = h; $('slHVal').textContent = h + ' h'; }
    }
    $('slStart').addEventListener('change', recalc);
    $('slEnd').addEventListener('change', recalc);
    bindActions(function () {
      T.logSleep(dayK, { start: $('slStart').value, end: $('slEnd').value, hours: +$('slH').value, quality: +$('slQ').value });
      snack('Zapisano sen: ' + $('slH').value + ' h.');
    });
  }

  var MOOD_TAGS = ['stres', 'zmotywowany', 'zmęczony', 'flow'];
  function moodForm(dayK) {
    openSheet(
      '<h2>Nastrój / energia</h2>' +
      sliderRow('mdMood', 'Nastrój', 1, 10, 1, 7, '/10') +
      sliderRow('mdEnergy', 'Energia', 1, 10, 1, 6, '/10') +
      '<div class="f-row"><span class="f-label">Tagi</span><div class="tagrow" id="mdTags">' +
        MOOD_TAGS.map(function (t) { return '<button class="tgl" data-tag="' + t + '">' + t + '</button>'; }).join('') +
      '</div></div>' +
      actions()
    );
    bindSlider('mdMood', '/10'); bindSlider('mdEnergy', '/10');
    $('mdTags').querySelectorAll('.tgl').forEach(function (b) {
      b.addEventListener('click', function () { toggle(b); });
    });
    bindActions(function () {
      var tags = [].slice.call($('mdTags').querySelectorAll('.tgl.on')).map(function (b) { return b.dataset.tag; });
      T.logMood(dayK, { t: T.nowHM(), mood: +$('mdMood').value, energy: +$('mdEnergy').value, tags: tags });
      snack('Nastrój ' + $('mdMood').value + ', energia ' + $('mdEnergy').value + '.');
    });
  }

  function mealForm(dayK) {
    var hist = T.mealHistory().slice(0, 6);
    openSheet(
      '<h2>Posiłek</h2>' +
      '<div class="f-row"><label class="f-label" for="mlName">Co</label>' +
      '<input type="text" id="mlName" placeholder="np. jajecznica" autocomplete="off">' +
      (hist.length ? '<div class="ac">' + hist.map(function (h) {
        return '<button data-n="' + h.name.replace(/"/g, '&quot;') + '" data-t="' + (h.typicalTime || '') + '">' +
          h.name + (h.typicalTime ? ' <small>~' + h.typicalTime + '</small>' : '') + '</button>';
      }).join('') + '</div>' : '') + '</div>' +
      '<div class="f-row" style="display:flex;gap:8px;align-items:flex-end">' +
        '<div style="flex:1"><label class="f-label" for="mlT">Pora</label><input type="time" id="mlT" value="' + T.nowHM() + '"></div>' +
        '<div style="flex:1"><label class="f-label" for="mlW">Waga ciała (opcj.)</label><input type="number" id="mlW" inputmode="decimal" step="0.1" placeholder="kg"></div>' +
      '</div>' +
      '<div class="f-row toggle-row">' +
        '<button class="tgl" id="mlFF">Fastfood</button>' +
        '<button class="tgl" id="mlAl">Alkohol</button>' +
      '</div>' + actions()
    );
    sheet.querySelectorAll('.ac button').forEach(function (b) {
      b.addEventListener('click', function () {
        $('mlName').value = b.dataset.n;
        if (b.dataset.t) $('mlT').value = b.dataset.t;
      });
    });
    $('mlFF').addEventListener('click', function () { toggle($('mlFF'), 'bad'); });
    $('mlAl').addEventListener('click', function () { toggle($('mlAl'), 'bad'); });
    bindActions(function () {
      var name = $('mlName').value.trim();
      if (name) {
        T.logMeal(dayK, { t: $('mlT').value, name: name, fastfood: $('mlFF').classList.contains('on'), alcohol: $('mlAl').classList.contains('on') });
      }
      var w = parseFloat($('mlW').value);
      if (!isNaN(w) && w > 0) T.logWeight(dayK, w);
      if (name || !isNaN(w)) snack(name ? 'Posiłek: ' + name + '.' : 'Zapisano wagę.');
    });
  }

  function moveForm(dayK) {
    var hist = T.moveHistory().slice(0, 5);
    openSheet(
      '<h2>Ruch</h2>' +
      '<div class="f-row"><label class="f-label" for="mvType">Typ</label>' +
      '<input type="text" id="mvType" placeholder="np. siłownia, bieg, spacer" autocomplete="off">' +
      (hist.length ? '<div class="ac">' + hist.map(function (h) {
        return '<button data-n="' + h.type + '" data-k="' + (h.kind || '') + '" data-m="' + (h.typicalMin || '') + '">' +
          h.type + (h.typicalMin ? ' <small>~' + h.typicalMin + ' min</small>' : '') + '</button>';
      }).join('') + '</div>' : '') + '</div>' +
      sliderRow('mvMin', 'Czas', 10, 180, 5, 60, ' min') +
      '<div class="f-row toggle-row">' +
        '<button class="tgl on" id="mvStr">Strength</button>' +
        '<button class="tgl" id="mvCar">Cardio</button>' +
      '</div>' + actions()
    );
    bindSlider('mvMin', ' min');
    function setKind(kind) {
      $('mvStr').classList.toggle('on', kind === 'strength');
      $('mvCar').classList.toggle('on', kind === 'cardio');
    }
    $('mvStr').addEventListener('click', function () { setKind('strength'); });
    $('mvCar').addEventListener('click', function () { setKind('cardio'); });
    sheet.querySelectorAll('.ac button').forEach(function (b) {
      b.addEventListener('click', function () {
        $('mvType').value = b.dataset.n;
        if (b.dataset.k) setKind(b.dataset.k);
        if (b.dataset.m) { $('mvMin').value = b.dataset.m; $('mvMinVal').textContent = b.dataset.m + ' min'; }
      });
    });
    bindActions(function () {
      var type = $('mvType').value.trim() || 'trening';
      var kind = $('mvStr').classList.contains('on') ? 'strength' : 'cardio';
      T.logMove(dayK, { t: T.nowHM(), type: type, min: +$('mvMin').value, kind: kind });
      snack('Ruch: ' + type + ', ' + $('mvMin').value + ' min.');
    });
  }

  function suppForm(dayK) {
    var hist = T.suppHistory().slice(0, 8);
    openSheet(
      '<h2>Suplement</h2>' +
      '<div class="f-row"><label class="f-label" for="spName">Co</label>' +
      '<input type="text" id="spName" placeholder="np. witamina D3" autocomplete="off">' +
      (hist.length ? '<div class="ac">' + hist.map(function (h) {
        return '<button data-n="' + h.name.replace(/"/g, '&quot;') + '">' + h.name + '</button>';
      }).join('') + '</div>' : '') + '</div>' +
      '<div class="f-row"><label class="f-label" for="spT">Kiedy</label><input type="time" id="spT" value="' + T.nowHM() + '"></div>' +
      actions()
    );
    sheet.querySelectorAll('.ac button').forEach(function (b) {
      b.addEventListener('click', function () {
        // one-tap log straight from chip
        T.logSupp(dayK, { t: $('spT').value, name: b.dataset.n });
        snack('Suplement: ' + b.dataset.n + '.');
        closeSheet();
      });
    });
    bindActions(function () {
      var name = $('spName').value.trim();
      if (!name) return;
      T.logSupp(dayK, { t: $('spT').value, name: name });
      snack('Suplement: ' + name + '.');
    });
  }

  function prodForm(dayK) {
    var ex = T.getDay(dayK).prod || { deepWork: 2, pomodoro: 4 };
    openSheet(
      '<h2>Produktywność</h2>' +
      sliderRow('prDW', 'Deep work', 0, 10, 0.5, ex.deepWork, ' h') +
      sliderRow('prPo', 'Pomodoro', 0, 20, 1, ex.pomodoro, '') +
      actions()
    );
    bindSlider('prDW', ' h'); bindSlider('prPo', '');
    bindActions(function () {
      T.logProd(dayK, { deepWork: +$('prDW').value, pomodoro: +$('prPo').value });
      snack('Deep work: ' + $('prDW').value + ' h.');
    });
  }

  // ---------- chips ----------
  $('chipWake').addEventListener('click', function () { sleepForm(todayKey, true); });
  $('chipMood').addEventListener('click', function () { moodForm(todayKey); });
  $('chipMeal').addEventListener('click', function () { mealForm(todayKey); });
  $('chipMove').addEventListener('click', function () { moveForm(todayKey); });
  $('chipSupp').addEventListener('click', function () { suppForm(todayKey); });
  $('chipProd').addEventListener('click', function () { prodForm(todayKey); });

  function renderChipHints() {
    var typ = T.typicalSleep();
    $('chipWakeHint').textContent = '→ ~' + typ.hours + ' h snu';
    var m = T.mealHistory()[0];
    $('chipMealHint').textContent = m ? 'ostatnio: ' + m.name + (m.typicalTime ? ' ~' + m.typicalTime : '') : 'co i kiedy';
    var mv = T.moveHistory()[0];
    $('chipMoveHint').textContent = mv ? 'ostatnio: ' + mv.type : 'typ + czas';
    var sp = T.suppHistory()[0];
    $('chipSuppHint').textContent = sp ? 'np. ' + sp.name : 'co i kiedy';
  }

  // ---------- count-up ----------
  var reduced = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  function countUp(el, target, decimals, suffix) {
    if (reduced || target == null) {
      el.textContent = target == null ? '—' : target.toFixed(decimals) + (suffix || '');
      return;
    }
    var start = null, dur = 550;
    function step(ts) {
      if (!start) start = ts;
      var p = Math.min(1, (ts - start) / dur);
      p = 1 - Math.pow(1 - p, 3);
      el.textContent = (target * p).toFixed(decimals) + (suffix || '');
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  // ---------- today render ----------
  function renderToday() {
    var s = T.summary(todayKey);
    var tiles = [
      { v: s.sleepH, d: 1, suf: 'h', l: 'Sen' },
      { v: s.mood, d: 1, suf: '', l: 'Nastrój' },
      { v: s.energy, d: 1, suf: '', l: 'Energia' },
      { v: s.deepWork, d: 1, suf: 'h', l: 'Deep work' },
      { v: s.moveMin || null, d: 0, suf: 'm', l: 'Ruch' },
      { v: s.weight, d: 1, suf: '', l: 'Waga kg' }
    ];
    var html = tiles.map(function (t, i) {
      return '<div class="tile"><div class="v" id="tile' + i + '">—</div><div class="l">' + t.l + '</div></div>';
    }).join('');
    $('tiles').innerHTML = html;
    tiles.forEach(function (t, i) { countUp($('tile' + i), t.v, t.d, t.suf); });

    var e = T.getDay(todayKey);
    var items = [];
    if (e.sleep) items.push({ t: e.sleep.end || '', html: 'Sen ' + e.sleep.hours + ' h', meta: 'jakość ' + e.sleep.quality + '/10' });
    e.meals.forEach(function (m) {
      items.push({ t: m.t, html: m.name, meta: (m.fastfood ? 'fastfood ' : '') + (m.alcohol ? 'alkohol' : ''), neg: m.fastfood || m.alcohol });
    });
    e.moods.forEach(function (m) {
      items.push({ t: m.t, html: 'Nastrój ' + m.mood + ' · energia ' + m.energy, meta: (m.tags || []).join(', ') });
    });
    e.moves.forEach(function (m) { items.push({ t: m.t, html: m.type + ' ' + m.min + ' min', meta: m.kind }); });
    e.supps.forEach(function (s2) { items.push({ t: s2.t, html: s2.name, meta: 'supl.' }); });
    if (e.prod) items.push({ t: '', html: 'Deep work ' + e.prod.deepWork + ' h', meta: e.prod.pomodoro + ' pomodoro' });
    items.sort(function (a, b) { return (a.t || '99').localeCompare(b.t || '99'); });
    $('timeline').innerHTML = items.length
      ? items.map(function (i) {
          return '<li><span class="t">' + (i.t || '·') + '</span><span class="what">' + i.html +
            '</span><span class="meta' + (i.neg ? ' neg' : '') + '">' + (i.meta || '') + '</span></li>';
        }).join('')
      : '<li class="empty">Brak wpisów. Zacznij od chipów wyżej — wpis zajmuje &lt;30 s.</li>';
  }

  // ---------- patterns render ----------
  function renderPatterns() {
    var f = T.findings();
    var body = $('patternsBody');
    if (!f.ready) {
      var pct = Math.round(100 * f.daysLogged / f.needed);
      body.innerHTML = '<p class="empty">Wzorce pojawią się po ' + f.needed + ' dniach danych — masz ' +
        f.daysLogged + '.</p><div class="progressbar"><i style="width:' + pct + '%"></i></div>';
    } else if (!f.items.length) {
      body.innerHTML = '<p class="empty">Za mało zróżnicowanych danych na korelacje — loguj dalej.</p>';
    } else {
      body.innerHTML = '<ul class="find">' + f.items.map(function (i) {
        var sign = i.delta > 0 ? '+' : '';
        return '<li><span class="d' + (i.delta < 0 ? ' neg' : '') + '">' + sign + i.delta +
          '</span><span>' + i.label + ' <span style="color:var(--text-3);font-family:var(--mono);font-size:11px">n=' + i.n + '</span></span></li>';
      }).join('') + '</ul>';
    }
    var sug = T.suggestToday();
    $('suggestion').classList.toggle('show', !!sug);
    if (sug) $('suggestionText').textContent = sug;

    var prof = T.weekdayProfile();
    var order = [1, 2, 3, 4, 5, 6, 0];
    $('weekdayBars').innerHTML = order.map(function (d, i) {
      var p = prof[d];
      var h = p.energy != null ? Math.max(4, p.energy * 10) : 3;
      var low = p.energy != null && p.energy <= 4.5;
      return '<div class="col"><div class="bar' + (low ? ' low' : '') + '" style="height:' + h + '%" title="' +
        (p.energy != null ? p.energy.toFixed(1) : '—') + '"></div><span class="lbl">' + DOWS[i] + '</span></div>';
    }).join('');
  }

  // ---------- heatmap + history ----------
  var hmDate = new Date(); hmDate.setDate(1);
  var hmMetric = 'mood';
  var METRIC_MAX = { mood: 10, energy: 10, sleepH: 9 };
  function hmColor(v, metric) {
    if (v == null) return null;
    var p = Math.max(0, Math.min(1, v / METRIC_MAX[metric]));
    return 'rgba(45, 212, 191, ' + (0.15 + p * 0.85).toFixed(2) + ')';
  }
  function renderHeatmap() {
    var y = hmDate.getFullYear(), m = hmDate.getMonth();
    $('hmLabel').textContent = MONTHS_NOM[m] + ' ' + y;
    var first = new Date(y, m, 1);
    var startBlank = (first.getDay() + 6) % 7; // Monday-first
    var daysIn = new Date(y, m + 1, 0).getDate();
    var sums = {};
    T.allSummaries().forEach(function (s) { sums[s.key] = s; });
    var html = DOWS.map(function (d) { return '<div class="hm-dow">' + d + '</div>'; }).join('');
    for (var i = 0; i < startBlank; i++) html += '<div class="hm-cell blank"></div>';
    for (var d = 1; d <= daysIn; d++) {
      var k = y + '-' + String(m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
      var s = sums[k];
      var v = s ? s[hmMetric] : null;
      var col = hmColor(v, hmMetric);
      html += '<div class="hm-cell' + (col ? ' has' : '') + (k === todayKey ? ' today' : '') +
        '" data-k="' + k + '"' + (col ? ' style="background:' + col + '"' : '') +
        ' title="' + (v != null ? v.toFixed(1) : 'brak danych') + '">' + d + '</div>';
    }
    $('hmGrid').innerHTML = html;
    $('hmGrid').querySelectorAll('.hm-cell[data-k]').forEach(function (c) {
      c.addEventListener('click', function () { dayEditModal(c.dataset.k); });
    });
  }
  $('hmPrev').addEventListener('click', function () { hmDate.setMonth(hmDate.getMonth() - 1); renderHeatmap(); });
  $('hmNext').addEventListener('click', function () { hmDate.setMonth(hmDate.getMonth() + 1); renderHeatmap(); });
  $('metricSeg').querySelectorAll('button').forEach(function (b) {
    b.addEventListener('click', function () {
      hmMetric = b.dataset.m;
      $('metricSeg').querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); });
      renderHeatmap();
    });
  });

  // ---------- day edit modal ----------
  function dayEditModal(k) {
    var e = T.getDay(k);
    var d = T.keyToDate(k);
    var rows = [];
    function row(t, label, kind, idx) {
      return '<li><span class="t">' + (t || '·') + '</span><span style="flex:1">' + label +
        '</span><button class="x" data-kind="' + kind + '" data-i="' + (idx == null ? '' : idx) + '" aria-label="Usuń">✕</button></li>';
    }
    if (e.sleep) rows.push(row(e.sleep.end, 'Sen ' + e.sleep.hours + ' h, jakość ' + e.sleep.quality, 'sleep'));
    e.meals.forEach(function (m, i) { rows.push(row(m.t, m.name + (m.fastfood ? ' · FF' : '') + (m.alcohol ? ' · alk.' : ''), 'meal', i)); });
    e.moods.forEach(function (m, i) { rows.push(row(m.t, 'Nastrój ' + m.mood + ' / energia ' + m.energy + ((m.tags||[]).length ? ' · ' + m.tags.join(', ') : ''), 'mood', i)); });
    e.moves.forEach(function (m, i) { rows.push(row(m.t, m.type + ' ' + m.min + ' min (' + m.kind + ')', 'move', i)); });
    e.supps.forEach(function (s, i) { rows.push(row(s.t, s.name, 'supp', i)); });
    if (e.prod) rows.push(row('', 'Deep work ' + e.prod.deepWork + ' h, ' + e.prod.pomodoro + ' pomodoro', 'prod'));
    if (e.weight != null) rows.push(row('', 'Waga ' + e.weight + ' kg', 'weight'));

    openSheet(
      '<h2>' + d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear() + '</h2>' +
      (rows.length ? '<ul class="edit-list">' + rows.join('') + '</ul>' : '<p class="empty">Brak wpisów tego dnia.</p>') +
      '<div class="btn-row" style="margin-top:6px">' +
        '<button class="btn" id="edSleep">+ Sen</button>' +
        '<button class="btn" id="edMeal">+ Posiłek</button>' +
        '<button class="btn" id="edMood">+ Nastrój</button>' +
        '<button class="btn" id="edMove">+ Ruch</button>' +
        '<button class="btn" id="edSupp">+ Supl.</button>' +
        '<button class="btn" id="edProd">+ Prod.</button>' +
      '</div>' +
      '<div class="sheet-actions"><button class="btn" id="shCancel">Zamknij</button></div>'
    );
    $('shCancel').addEventListener('click', closeSheet);
    sheet.querySelectorAll('.x').forEach(function (b) {
      b.addEventListener('click', function () {
        var e2 = T.getDay(k);
        var kind = b.dataset.kind, i = b.dataset.i === '' ? null : +b.dataset.i;
        if (kind === 'sleep') e2.sleep = null;
        else if (kind === 'prod') e2.prod = null;
        else if (kind === 'weight') e2.weight = null;
        else if (kind === 'meal') e2.meals.splice(i, 1);
        else if (kind === 'mood') e2.moods.splice(i, 1);
        else if (kind === 'move') e2.moves.splice(i, 1);
        else if (kind === 'supp') e2.supps.splice(i, 1);
        T.saveDay(k, e2);
        snack('Usunięto wpis.');
        dayEditModal(k); // re-render
      });
    });
    $('edSleep').addEventListener('click', function () { sleepForm(k); });
    $('edMeal').addEventListener('click', function () { mealForm(k); });
    $('edMood').addEventListener('click', function () { moodForm(k); });
    $('edMove').addEventListener('click', function () { moveForm(k); });
    $('edSupp').addEventListener('click', function () { suppForm(k); });
    $('edProd').addEventListener('click', function () { prodForm(k); });
  }

  // ---------- export / demo / wipe ----------
  function download(name, text, mime) {
    var blob = new Blob([text], { type: mime });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }
  $('btnExportJSON').addEventListener('click', function () {
    download('life-' + todayKey + '.json', T.exportJSON(), 'application/json');
  });
  $('btnExportCSV').addEventListener('click', function () {
    download('life-' + todayKey + '.csv', T.exportCSV(), 'text/csv');
  });
  $('btnDemo').addEventListener('click', function () {
    if (T.listDayKeys().length && !confirm('Nadpisać istniejące dni danymi demo?')) return;
    T.seedDemo(30);
    snack('Wczytano 30 dni danych demo.');
  });
  $('btnWipe').addEventListener('click', function () {
    if (!confirm('Usunąć WSZYSTKIE dane Life Trackera? Tego nie da się cofnąć.')) return;
    T.wipeAll();
    snack('Wyczyszczono dane.');
  });

  // ---------- master render ----------
  function renderAll() {
    todayKey = T.dateKey();
    renderChipHints();
    renderToday();
    renderPatterns();
    renderHeatmap();
    $('demoNote').style.display = T.isDemo() ? 'block' : 'none';
  }
  T.onChange(renderAll);
  window.addEventListener('storage', renderAll);
  renderAll();
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
})();
</script>
